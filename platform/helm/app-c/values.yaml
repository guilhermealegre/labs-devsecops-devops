namespace: app-c

registry: "YOUR_ACCOUNT_ID.dkr.ecr.eu-west-1.amazonaws.com/devops-lab"
imageTag: latest

imagePullSecrets: []

backend:
  image: app-c-backend
  replicas: 3
  port: 8080
  resources:
    requests:
      memory: "32Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"

frontend:
  image: app-c-frontend
  replicas: 2
  port: 80
  resources:
    requests:
      memory: "32Mi"
      cpu: "10m"
    limits:
      memory: "128Mi"
      cpu: "100m"

ingress:
  host: app-c.local
  className: nginx

db:
  secretName: app-c-db-secret
