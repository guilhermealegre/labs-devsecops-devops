---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-c-backend
  namespace: {{ .Values.namespace }}
  labels:
    app: app-c-backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: app-c-backend
  template:
    metadata:
      labels:
        app: app-c-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.backend.port }}"
        prometheus.io/path: "/metrics"
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.registry }}/{{ .Values.backend.image }}:{{ .Values.imageTag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.backend.port }}
              name: http
          envFrom:
            - secretRef:
                name: {{ .Values.db.secretName }}
          env:
            - name: PORT
              value: "{{ .Values.backend.port }}"
            - name: RUST_LOG
              value: "info"
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: app-c-backend
  namespace: {{ .Values.namespace }}
  labels:
    app: app-c-backend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
      name: http
  selector:
    app: app-c-backend
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: app-c-backend
  namespace: {{ .Values.namespace }}
  labels:
    app: app-c-backend
spec:
  selector:
    matchLabels:
      app: app-c-backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
  namespaceSelector:
    matchNames:
      - {{ .Values.namespace }}
