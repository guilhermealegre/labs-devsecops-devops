namespace: app-b

registry: "YOUR_ACCOUNT_ID.dkr.ecr.eu-west-1.amazonaws.com/devops-lab"
imageTag: latest

imagePullSecrets: []

api:
  image: app-b-api
  replicas: 2
  port: 8080
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "300m"

worker:
  image: app-b-worker
  replicas: 2
  metricsPort: 8080
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

frontend:
  image: app-b-frontend
  replicas: 2
  port: 80
  resources:
    requests:
      memory: "32Mi"
      cpu: "10m"
    limits:
      memory: "128Mi"
      cpu: "100m"

ingress:
  host: app-b.local
  className: nginx

# RabbitMQ deployed in-cluster inside this app's namespace
rabbitmq:
  deploy: true            # set false to use an external broker
  user: "guest"
  password: "guest"
  queue: "jobs"
  storage: 5Gi
  storageClass: gp2
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# MongoDB via AWS DocumentDB (secret injected by Terraform)
mongodb:
  secretName: docdb-credentials
