apiVersion: v1
kind: Secret
metadata:
  name: app-b-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  RABBITMQ_HOST: "rabbitmq.{{ .Values.namespace }}.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: "{{ .Values.rabbitmq.user }}"
  RABBITMQ_PASSWORD: "{{ .Values.rabbitmq.password }}"
  RABBITMQ_QUEUE: "{{ .Values.rabbitmq.queue }}"
  RABBITMQ_URL: "amqp://{{ .Values.rabbitmq.user }}:{{ .Values.rabbitmq.password }}@rabbitmq.{{ .Values.namespace }}.svc.cluster.local:5672/"
  # MongoDB credentials come from the docdb-credentials secret injected by Terraform (platform/iac/docdb)
