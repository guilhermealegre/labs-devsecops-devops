---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-b-api
  namespace: {{ .Values.namespace }}
  labels:
    app: app-b-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: app-b-api
  template:
    metadata:
      labels:
        app: app-b-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.api.port }}"
        prometheus.io/path: "/metrics"
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.registry }}/{{ .Values.api.image }}:{{ .Values.imageTag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.api.port }}
              name: http
          envFrom:
            - secretRef:
                name: app-b-secret
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: app-b-api
  namespace: {{ .Values.namespace }}
  labels:
    app: app-b-api
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
      name: http
  selector:
    app: app-b-api
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: app-b-api
  namespace: {{ .Values.namespace }}
  labels:
    app: app-b-api
spec:
  selector:
    matchLabels:
      app: app-b-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
  namespaceSelector:
    matchNames:
      - {{ .Values.namespace }}
