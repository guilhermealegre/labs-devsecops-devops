---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-b-worker
  namespace: {{ .Values.namespace }}
  labels:
    app: app-b-worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: app-b-worker
  template:
    metadata:
      labels:
        app: app-b-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.worker.metricsPort }}"
        prometheus.io/path: "/metrics"
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.registry }}/{{ .Values.worker.image }}:{{ .Values.imageTag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.worker.metricsPort }}
              name: metrics
          envFrom:
            - secretRef:
                name: app-b-secret
          env:
            - name: METRICS_PORT
              value: "{{ .Values.worker.metricsPort }}"
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.worker.metricsPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.worker.metricsPort }}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: app-b-worker
  namespace: {{ .Values.namespace }}
  labels:
    app: app-b-worker
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.worker.metricsPort }}
      targetPort: {{ .Values.worker.metricsPort }}
      name: metrics
  selector:
    app: app-b-worker
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: app-b-worker
  namespace: {{ .Values.namespace }}
  labels:
    app: app-b-worker
spec:
  selector:
    matchLabels:
      app: app-b-worker
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
  namespaceSelector:
    matchNames:
      - {{ .Values.namespace }}
