name: "[ztk/app-b] worker — Go"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app-b/worker/**"

env:
  SERVICE: app-b-worker
  CONTEXT: app-b/worker
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-west-1.amazonaws.com
  ECR_REPO: devops-lab/app-b-worker
  AWS_REGION: eu-west-1
  DEFECTDOJO_PRODUCT: app-b
  DEFECTDOJO_ENGAGEMENT: worker

jobs:
  sast:
    name: "SAST"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.21"
          go-package: ./...
          work-dir: ${{ env.CONTEXT }}
        continue-on-error: true
      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: auto
          generateSarif: "1"
          auditOn: always
        env:
          SEMGREP_RULES: p/golang p/owasp-top-ten
        continue-on-error: true
      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep-${{ env.SERVICE }}
      - name: Upload to DefectDojo
        if: always()
        run: |
          curl -s -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -F "scan_type=Semgrep JSON Report" -F "file=@semgrep.sarif" \
            -F "product_name=${{ env.DEFECTDOJO_PRODUCT }}" \
            -F "engagement_name=${{ env.DEFECTDOJO_ENGAGEMENT }}-sast" \
            -F "auto_create_context=true" || true

  sca:
    name: "SCA"
    runs-on: ubuntu-latest
    needs: sast
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Snyk — Go
        uses: snyk/actions/golang@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --json-file-output=snyk.json
          command: test
          json: true
        continue-on-error: true
      - name: Snyk monitor
        uses: snyk/actions/golang@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
        continue-on-error: true
      - name: Trivy — filesystem
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ${{ env.CONTEXT }}
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
      - name: Upload Trivy FS SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs-${{ env.SERVICE }}
      - name: Upload to DefectDojo
        if: always()
        run: |
          curl -s -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -F "scan_type=Snyk Scan" -F "file=@snyk.json" \
            -F "product_name=${{ env.DEFECTDOJO_PRODUCT }}" \
            -F "engagement_name=${{ env.DEFECTDOJO_ENGAGEMENT }}-sca" \
            -F "auto_create_context=true" || true

  build:
    name: "Build & Container Scan"
    runs-on: ubuntu-latest
    needs: sca
    permissions:
      id-token: write
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Set image tag
        id: meta
        run: |
          TAG=$(git rev-parse --short HEAD)
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "image=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${TAG}" >> $GITHUB_OUTPUT
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.CONTEXT }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.meta.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:latest
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:cache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:cache,mode=max
      - name: Snyk — container
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ steps.meta.outputs.image }}
          args: --severity-threshold=high --json-file-output=snyk-container.json
        continue-on-error: true
      - name: Trivy — image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
      - name: Upload Trivy image SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ env.SERVICE }}
      - name: Upload to DefectDojo
        if: always()
        run: |
          curl -s -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -F "scan_type=Trivy Scan" -F "file=@trivy-image.sarif" \
            -F "product_name=${{ env.DEFECTDOJO_PRODUCT }}" \
            -F "engagement_name=${{ env.DEFECTDOJO_ENGAGEMENT }}-container" \
            -F "auto_create_context=true" || true
      - name: Summary
        run: echo "### Pushed \`${{ steps.meta.outputs.image }}\`" >> $GITHUB_STEP_SUMMARY

  dast:
    name: "DAST — ZAP (metrics endpoint)"
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: ZAP baseline
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ vars.APP_B_WORKER_METRICS_URL }}
          cmd_options: "-I"
          issue_title: "ZAP — app-b/worker"
        continue-on-error: true
      - name: Upload to DefectDojo
        if: always()
        run: |
          curl -s -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -F "scan_type=ZAP Scan" -F "file=@report_html.html" \
            -F "product_name=${{ env.DEFECTDOJO_PRODUCT }}" \
            -F "engagement_name=${{ env.DEFECTDOJO_ENGAGEMENT }}-dast" \
            -F "auto_create_context=true" || true
